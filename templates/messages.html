<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Opened Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4 text-center">Messages That Have Opened</h2>

    {% for msg in messages %}
        {% if msg.is_open() %}
        <div class="message-card p-3 mb-3 bg-white rounded shadow">
            <p><strong>{{ msg.username }}</strong> wrote:</p>
            <p>{{ msg.content }}</p>
            <p class="text-muted"><em>Opened on: {{ msg.open_date.date() }}</em></p>
        </div>
        {% endif %}
    {% endfor %}

    <p class="text-center mt-3"><a href="{{ url_for('index') }}">Home</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
