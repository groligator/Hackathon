<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Time Capsule{% endblock %}</title>
    
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Antique / museum style CSS -->
    <style>
        body {
            background-color: #f7f1e0; /* light parchment */
            font-family: "Georgia", serif;
            color: #3e2c1c; /* dark brown text */
        }

        h1, h2, h3, h4, h5 {
            font-family: "Times New Roman", Times, serif;
            color: #4a3221;
        }

        .card {
            background-color: #fff4e6;
            border: 1px solid #d1bfa7;
            border-radius: 10px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
        }

        .card-title {
            font-weight: bold;
        }

        .nav-tabs .nav-link.active {
            background-color: #d9c4a6;
            color: #3e2c1c;
        }

        .nav-tabs .nav-link {
            color: #3e2c1c;
        }

        .btn-primary {
            background-color: #a67c52;
            border-color: #a67c52;
        }

        .btn-primary:hover {
            background-color: #8c633f;
            border-color: #8c633f;
        }

        textarea.form-control {
            font-family: "Georgia", serif;
        }

        input.form-control, input[type="date"] {
            font-family: "Georgia", serif;
        }

        .small {
            font-size: 0.85rem;
        }

        .text-muted {
            color: #6c4a32 !important;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
