{% extends "base.html" %}
{% block title %}Submit Message - Time Capsule{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">📩 Submit a Time Capsule</h1>
    <form method="POST" action="{{ url_for('submit') }}">
        <div class="mb-3">
            <label for="username" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your name" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Message</label>
            <textarea class="form-control" id="content" name="content" rows="4" placeholder="Write your message..." required></textarea>
        </div>
        <div class="mb-3">
            <label for="open_date" class="form-label">Unlock Date</label>
            <input type="date" class="form-control" id="open_date" name="open_date" required>
            <small class="form-text text-muted">This message will be unlocked on this date.</small>
        </div>
        <button type="submit" class="btn btn-primary">Submit Capsule</button>
    </form>
</div>
{% endblock %}
