{% extends "base.html" %}
{% block title %}Submit Message - Time Capsule{% endblock %}

{% block content %}
<div class="col-md-6 mx-auto">
    <div class="card shadow-lg rounded-4">
        <div class="card-body p-4">
            <h2 class="text-center mb-4">✉️ Create Your Time Capsule</h2>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Your Name</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">Your Message</label>
                    <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="open_date" class="form-label">Open Date</label>
                    <input type="date" class="form-control" id="open_date" name="open_date" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">Save to Capsule</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
