<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Submit Message</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4 text-center">Submit a Time Capsule Message</h2>
    <form method="POST" class="mx-auto p-4 bg-white shadow rounded" style="max-width: 500px;">
        <div class="mb-3">
            <label class="form-label">Username:</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Message:</label>
            <textarea name="content" rows="5" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Open Date:</label>
            <input type="date" name="open_date" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Submit</button>
    </form>
    <p class="text-center mt-3"><a href="{{ url_for('index') }}">Home</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
