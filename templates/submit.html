{% extends "base.html" %}
{% block title %}Submit a Time Capsule{% endblock %}

{% block content %}
<h1 class="text-center mb-4">✉️ Submit a Time Capsule</h1>

<div class="row justify-content-center">
    <div class="col-md-6">
        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Your Name</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="e.g., John Doe" required>
            </div>
            
            <div class="mb-3">
                <label for="content" class="form-label">Message</label>
                <textarea class="form-control" id="content" name="content" rows="5" placeholder="Write your message..." required></textarea>
            </div>
            
            <div class="mb-3">
                <label for="open_date" class="form-label">Open Date</label>
                <input type="date" class="form-control" id="open_date" name="open_date" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Seal Capsule</button>
        </form>
    </div>
</div>
{% endblock %}
